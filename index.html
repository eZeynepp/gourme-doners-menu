<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourme Döner's Menü</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Resimlerin ekranda düzgün durması için ufak dokunuşlar */
        .urun-listesi {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Sol ve sağ 2 sütun */
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            justify-items: center;
        }
        .urun-karti {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .urun-gorsel {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .urun-detay {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .urun-isim {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .urun-fiyat {
            color: #ff6600;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="color: #fff; text-align: center;">GOURME DÖNER'S</h1>
        <p style="color: #ff6600; text-align: center;">Özel Sosumuzla Katlanan Efsane Lezzet</p>
    </header>

    <main id="menu-container">
        <!-- Ürünler buraya otomatik gelecek -->
    </main>

    <footer style="text-align: center; color: #fff; margin-top: 40px; padding-bottom: 20px;">
        <p>Paket Servis: 0542 161 66 03</p>
        <p>Duaçınarı Mah. Yeşilova Sok. No: 10/A Yıldırım / BURSA</p>
    </footer>

    <script>
        fetch('menu.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('menu-container');
                
                // Ana yemekler için grid listesi
                const yemekListesi = document.createElement('ul');
                yemekListesi.className = 'urun-listesi';
                
                // İçecekler için alt bölüm
                const icecekBolumu = document.createElement('div');
                icecekBolumu.style.cssText = "margin-top: 40px; max-width: 600px; margin-left: auto; margin-right: auto; padding: 20px; background: #222; border-radius: 10px;";
                icecekBolumu.innerHTML = `<h2 style="color: #ff6600; text-align: center; margin-bottom: 15px;">İÇECEKLER</h2>`;
                
                const icecekListesi = document.createElement('ul');
                icecekListesi.style.cssText = "list-style: none; padding: 0;";

                data.forEach(urun => {
                    if (urun.tip === "icecek") {
                        // Resimsiz sade içecek satırı
                        const li = document.createElement('li');
                        li.style.cssText = "display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; color: #fff; font-size: 1.1rem;";
                        li.innerHTML = `<span>${urun.isim}</span> <span style="color: #ff6600; font-weight: bold;">${urun.fiyat} ₺</span>`;
                        icecekListesi.appendChild(li);
                    } else {
                        // Yemekleri fotoğraflı kart olarak ekle
                        const li = document.createElement('li');
                        li.className = 'urun-karti';
                        li.innerHTML = `
                            <img src="${urun.image}" alt="${urun.isim}" class="urun-gorsel">
                            <div class="urun-detay">
                                <span class="urun-isim">${urun.isim}</span> 
                                <span class="urun-fiyat">${urun.fiyat} ₺</span>
                            </div>
                        `;
                        yemekListesi.appendChild(li);
                    }
                });
                
                container.appendChild(yemekListesi);
                
                if (icecekListesi.children.length > 0) {
                    icecekBolumu.appendChild(icecekListesi);
                    container.appendChild(icecekBolumu);
                }
            })
            .catch(error => console.error('Menü yüklenirken hata oluştu:', error));
    </script>
</body>
</html>
